<script>
/* ===== 截圖 lightbox（fullscreen zoom/pan） ===== */
let lbScale = 1, lbTx = 0, lbTy = 0, lbImg = null, lbWrap = null;
function openLightbox(src) {
  lbImg = document.getElementById('lightboxImg');
  lbWrap = document.getElementById('lightboxWrap');
  document.getElementById('lightbox').classList.add('open');
  lbImg.src = src;
  lbScale = 1; lbTx = 0; lbTy = 0;
  applyLbTransform();
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e, force) {
  if (!force && e && e.target.tagName === 'IMG') return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function applyLbTransform() {
  if (lbImg) lbImg.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
}
document.addEventListener('DOMContentLoaded', () => {
  const lb = document.getElementById('lightbox');
  lb.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.15 : 0.87;
    lbScale = Math.min(6, Math.max(0.5, lbScale * delta));
    applyLbTransform();
  }, { passive: false });
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  lb.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = lbTx; oy = lbTy;
    lbWrap.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    lbTx = ox + (e.clientX - sx); lbTy = oy + (e.clientY - sy);
    applyLbTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; lbWrap.classList.remove('dragging'); });
  let tStart = null;
  lb.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) { tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, ox: lbTx, oy: lbTy }; }
  }, { passive: true });
  lb.addEventListener('touchmove', (e) => {
    if (tStart && e.touches.length === 1) {
      e.preventDefault();
      lbTx = tStart.ox + (e.touches[0].clientX - tStart.x);
      lbTy = tStart.oy + (e.touches[0].clientY - tStart.y);
      applyLbTransform();
    }
  }, { passive: false });
  lb.addEventListener('touchend', () => { tStart = null; });
  lb.addEventListener('dblclick', (e) => {
    if (e.target.tagName === 'IMG') {
      if (lbScale > 1.1) { lbScale = 1; lbTx = 0; lbTy = 0; }
      else { lbScale = 2.5; }
      applyLbTransform();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
});
</script>

.tl-day h4 .dt{color:var(--sub);font-size:11px;font-weight:400}
.tl-item{position:relative;padding-left:26px;padding-bottom:10px}
.tl-item::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#2e3a55,#1a2233)}
.tl-item::after{content:'';position:absolute;left:3px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-item.done::after{background:var(--green)}
.tl-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.tl-time{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-act{font-size:15px;font-weight:700}
.tl-plan{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.55}
.tl-note{font-size:11px;color:#ffd489;margin-top:6px;line-height:1.5}
.tl-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:7px}
.tl-meta span{background:var(--card2);border-radius:8px;padding:2px 8px}
.tl-btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tl-btn{background:var(--card2);border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.tl-btn:active{transform:scale(.97)}
.tl-btn.done{color:var(--green);border-color:rgba(61,214,140,.45)}
.tl-btn.map{color:var(--accent);border-color:rgba(79,140,255,.45)}
.tl-draft{font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(255,197,61,.15);color:var(--yellow);font-weight:600}
.tl-draft.ok{background:rgba(61,214,140,.15);color:var(--green)}
.tl-edit{background:var(--card2);border:1px dashed var(--border);border-radius:10px;padding:10px;margin-top:9px;display:flex;flex-direction:column;gap:8px}
.tl-edit .erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-edit select,.tl-edit input[type=time]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px}
.tl-edit .e-hint{font-size:11px;color:var(--sub);line-height:1.5}
.tl-empty{color:var(--sub);text-align:center;padding:24px;font-size:13px}
#tripMap{width:100%;height:430px}
#tripMap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.85)}
.trip-place-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.place-row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer}
.place-row.on{border-color:var(--accent);background:var(--card2)}
.place-row .dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.place-row .pr-act{font-size:13px;font-weight:600}
.place-row .pr-sub{font-size:11px;color:var(--sub);margin-top:2px}
.j09-toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);background:rgba(26,34,51,.96);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:22px;font-size:12px;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:1200;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.j09-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

</head>
<body>

<div class="container">
  <div class="header">
    <h1>
      <img class="logo" src="cathay-logo.png" alt="Cathay">
      國泰員工機票
    </h1>
    <div class="meta">
      <div><span class="version" id="version">v1.20</span> &nbsp;|&nbsp; 更新：<span id="lastUpdate">-</span></div>
    </div>
  </div>
</div>

<div class="tab-panel active" id="panel-flights">
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div class="section-title" style="margin-bottom:0">📋 全部航班記錄</div>
      <div style="display:flex;gap:6px">
        <button class="mini-btn" onclick="manualRefresh()" style="border-color:var(--blue,#1677ff);color:var(--blue,#1677ff)">🔄 Refresh</button>
        <button class="mini-btn" id="resetBtn" onclick="resetEdits()" style="border-color:var(--red);color:var(--red)">🗑 清除未推送</button>
        <button class="mini-btn" id="pushBtn" onclick="pushToLark()" style="border-color:var(--green);color:var(--green)">📤 推送實付</button>
      </div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="upcoming">✈️ 即將起飛</button>
      <button class="filter-btn" data-filter="Accepted">Accepted</button>
      <button class="filter-btn" data-filter="Rejected">Rejected</button>
      <button class="filter-btn" data-filter="No Show">No Show</button>
    </div>
    <div class="sort-row">
      <span class="fl-label">排序</span>
      <select id="sortSelect" class="combo">
        <option value="time_desc" selected>🕐 起飛時間 ↓（最新先）</option>
        <option value="time_asc">🕐 起飛時間 ↑（最早先）</option>
        <option value="disc_desc">💰 折扣% ↓（最大先）</option>
        <option value="disc_asc">💰 折扣% ↑（最小先）</option>
      </select>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜尋航班號 / 航線 / 乘客...">
    <div id="ticketList" style="margin-top:10px"></div>
    <div class="footer">Cathay Staff Tickets · J09</div>
  </div>
</div>

<div class="tab-panel" id="panel-analytics">
  <div class="container">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="chart-card" style="margin-top:14px">
      <h3>✈️ 國泰員工機票使用統計</h3>
      <div class="chart-box" id="topFlyersChart" style="height:280px"></div>
      <div id="topFlyersAvatars" style="display:flex;justify-content:space-around;align-items:flex-start;padding:10px 20px 5px 50px"></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Final Status 分佈</h3>
        <div class="chart-box" id="pieChart"></div>
      </div>
      <div class="chart-card">
        <h3>Rolling Probability 趨勢</h3>
        <div class="chart-box" id="lineChart"></div>
      </div>
    </div>
    <div class="section-title" style="margin-top:18px">🌍 世界地圖 · 乘客航線</div>
    <div class="map-filters">
      <div class="filter-row">
        <span class="fl-label">👥 乘客</span>
        <select id="paxSelect" class="combo">
          <option value="">（無）不顯示航線</option>
        </select>
        <span class="fl-label">🗺 機場</span>
        <select id="airportSelect" class="combo">
          <option value="ALL">全部</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="fl-label">🗓 月份</span>
        <input type="range" id="monthSlider" class="month-slider" min="0" max="0" value="0">
        <span id="monthLabel" class="month-label">全部</span>
        <button id="monthAllBtn" class="mini-btn">全部</button>
        <span class="fl-label">🌏 區域</span>
        <select id="regionSelect" class="combo">
          <option value="ALL">全部區域</option>
          <option value="SEA">🌏 東南亞及澳洲</option>
          <option value="NEA">🗾 東北亞</option>
          <option value="EU">🏰 歐洲</option>
          <option value="MEA">🕌 中東及非洲</option>
          <option value="AM">🌎 美洲</option>
        </select>
      </div>
    </div>
    <div class="map-wrap">
      <div id="mapChart"></div>
    </div>
    <div class="airport-detail-panel" id="airportDetail"></div>
    <div class="footer">Cathay Staff Tickets · J09</div>
  </div>
</div>

<div class="tab-panel" id="panel-itinerary">
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div class="section-title" style="margin-bottom:0">🧭 設計行程</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="mini-btn" id="itinPushBtn" onclick="pushTripEdits()" style="display:none;border-color:#ffc53d;color:#ffc53d">⬆️ 推送更改（0）</button>
        <button class="mini-btn" onclick="reloadItinerary()">🔄 重載行程</button>
        <button class="mini-btn" onclick="updateItineraryJson()">⚙️ 更新 .json</button>
      </div>
    </div>
    <div class="trip-head" id="tripHeader"></div>
    <div id="tripProgress"></div>
    <div class="next-card" id="nextCard"></div>
    <div class="filter-bar">
      <button class="trip-filter-btn active" data-trip="all">全部</button>
      <button class="trip-filter-btn" data-trip="pending">⏳ 未完成</button>
      <button class="trip-filter-btn" data-trip="done">✅ 已完成</button>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="footer">Cathay Staff Tickets · J09</div>
  </div>
</div>

<div class="tab-panel" id="panel-tripmap">
  <div class="container">
    <div class="section-title">🗺 設計行程圖</div>
    <div class="filter-bar">
      <select id="tripDaySelect" class="combo" style="max-width:200px"></select>
      <button class="mini-btn" onclick="fitTrip()">🗺 全覽</button>
      <button class="mini-btn" onclick="fitTripZoom()">🔍 最近點放大</button>
    </div>
    <div class="map-wrap"><div id="tripMap"></div></div>
    <div class="trip-place-list" id="tripPlaceList"></div>
    <div class="footer">Cathay Staff Tickets · J09</div>
  </div>
</div>


<nav class="tab-bar">
  <button class="tab-btn active" data-tab="flights">
    <span class="tab-icon">✈️</span>
    <span>航班</span>
  </button>
  <button class="tab-btn" data-tab="analytics">
    <span class="tab-icon">📊</span>
    <span>航班統計</span>
  </button>
  <button class="tab-btn" data-tab="itinerary">
    <span class="tab-icon">🧭</span>
    <span>設計行程</span>
  </button>
  <button class="tab-btn" data-tab="tripmap">
    <span class="tab-icon">🗺</span>
    <span>行程圖</span>
  </button>
</nav>

<div class="modal-overlay" id="pushModal" onclick="if(event.target===this)closePushModal()">
  <div class="modal-box">
    <h3>📤 推送實付到飛書</h3>
    <div class="modal-status" id="pushStatus"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closePushModal()">關閉</button>
    </div>
  </div>
</div>

<script>
let DATA = null;
const AIRPORTS = {
  HKG: { name: '香港國際機場', city: '香港', lat: 22.3080, lng: 113.9145, region: 'NEA' },
  KIX: { name: '關西國際機場', city: '大阪', lat: 34.4347, lng: 135.2300, region: 'NEA' },
  TAO: { name: '青島膠東國際機場', city: '青島', lat: 37.3918, lng: 120.0864, region: 'NEA' },
  NRT: { name: '成田國際機場', city: '東京', lat: 35.7647, lng: 140.3864, region: 'NEA' },
  URC: { name: '烏魯木齊天山國際機場', city: '烏魯木齊', lat: 43.9071, lng: 87.4742, region: 'NEA' },
  YVR: { name: '溫哥華國際機場', city: '溫哥華', lat: 49.1967, lng: -123.1816, region: 'AM' },
  ICN: { name: '仁川國際機場', city: '首爾', lat: 37.4602, lng: 126.4407, region: 'NEA' },
  DPS: { name: '伍拉·賴國際機場', city: '峇里島', lat: -8.7482, lng: 115.1675, region: 'SEA' },
  SYD: { name: '金斯福德·史密斯機場', city: '雪梨', lat: -33.9461, lng: 151.1772, region: 'SEA' }
};
const REGION_LABEL = { SEA: '東南亞及澳洲', NEA: '東北亞', EU: '歐洲', MEA: '中東及非洲', AM: '美洲' };
const PLANE_PATH = 'M21,16v-2l-8,-5V3.5C13,2.67 12.33,2 11.5,2S10,2.67 10,3.5V9l-8,5v2l8,-2.5V19l-2,1.5V22l3.5,-1 3.5,1v-1.5L13,19v-5.5L21,16z';
let mapChart = null;
let mapHasGeo = true;
let selectedPax = null;
let selectedAirportCode = 'ALL';
let selectedRegion = 'ALL';
let selectedMonth = null;
let monthsList = [];

async function loadData() {
  try {
    const res = await fetch('cathay.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    renderAll();
  } catch (e) {
    console.error('載入失敗:', e);
    document.getElementById('statsGrid').innerHTML = '<div class="empty">❌ 無法載入 cathay.json（' + e.message + '）</div>';
  }
}

function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }
function fmtMoney(v) { return v != null && !isNaN(v) ? '$' + Number(v).toLocaleString() : null; }

function renderAll() {
  document.getElementById('lastUpdate').textContent = DATA.lastUpdate;
  renderStats();
  renderPie();
  renderLine();
  renderTopFlyers();
  renderTickets('all', '');
  renderPaxCombo();
  renderAirportCombo();
  setupMonthSlider();
  renderMap();
  updateActionBar();
}

function renderStats() {
  const s = DATA.stats;
  const cards = [
    { label: '航班總數', value: s.noOfFlights, sub: '（有狀態）', cls: 'blue' },
    { label: '% Successful', value: fmtPct(s.successRate), sub: s.successful + ' 班 Accepted', cls: 'green' },
    { label: 'Avg Booked', value: fmtPct(s.avgBooked), sub: '平均訂位率', cls: 'blue' },
    { label: 'Avg Staff %', value: fmtPct(s.avgStaffPercent), sub: '平均員工比例', cls: 'gold' },
    { label: 'Avg Discount', value: fmtPct(s.avgDiscount), sub: '平均折扣', cls: 'green' },
    { label: 'Avg Standby', value: s.avgStaffCount, sub: '平均候補人數', cls: 'blue' }
  ];
  document.getElementById('statsGrid').innerHTML = cards.map(c =>
    `<div class="stat-card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub-label">${c.sub}</div></div>`
  ).join('');
}

function renderPie() {
  const chart = echarts.init(document.getElementById('pieChart'));
  const dist = DATA.stats.statusDist;
  const colors = { Accepted: '#3dd68c', Rejected: '#ff5d6c', 'No Show': '#ffc53d' };
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', formatter: '{b}: {c} 班 ({d}%)' },
    legend: { bottom: 0, textStyle: { color: '#8fa0b8' } },
    series: [{
      type: 'pie', radius: ['45%', '70%'], center: ['50%', '45%'],
      itemStyle: { borderRadius: 6, borderColor: '#1a2233', borderWidth: 2 },
      label: { color: '#e8ecf4', formatter: '{b}\n{c} 班' },
      data: dist.map(d => ({ name: d.status, value: d.count, itemStyle: { color: colors[d.status] || '#4f8cff' } }))
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderLine() {
  const chart = echarts.init(document.getElementById('lineChart'));
  const rolling = DATA.rollingProb;
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    grid: { left: 45, right: 20, top: 20, bottom: 40 },
    xAxis: { type: 'category', data: rolling.map(r => r.time), axisLabel: { color: '#8fa0b8', rotate: 30, fontSize: 10 }, axisLine: { lineStyle: { color: '#2e3a55' } } },
    yAxis: { type: 'value', min: 0, max: 1, axisLabel: { color: '#8fa0b8', formatter: v => (v * 100).toFixed(0) + '%' }, splitLine: { lineStyle: { color: '#1a2233' } } },
    series: [{ type: 'line', data: rolling.map(r => r.prob), smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { color: '#4f8cff', width: 3 }, itemStyle: { color: '#4f8cff' }, areaStyle: { color: 'rgba(79,140,255,0.15)' } }]
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderTopFlyers() {
  const el = document.getElementById('topFlyersChart');
  if (!el || !DATA.topFlyers || !DATA.topFlyers.length) return;
  const chart = echarts.init(el);
  const data = DATA.topFlyers.slice();
  const names = data.map(d => d.name);
  const values = data.map(d => d.flights);
  const maxV = Math.max(...values);
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis', formatter: p => p[0].name + ': ' + p[0].value + ' 班' },
    grid: { left: 50, right: 20, top: 30, bottom: 20 },
    xAxis: { type: 'category', data: names, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#2e3a55' } } },
    yAxis: { type: 'value', minInterval: 1, max: maxV + 1.5, axisLabel: { color: '#8fa0b8' }, splitLine: { lineStyle: { color: '#1a2233' } } },
    series: [
      { type: 'bar', data: values, barMaxWidth: 50, itemStyle: { borderRadius: [6, 6, 0, 0], color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#4f8cff' }, { offset: 1, color: '#2a56c9' }] } }, label: { show: true, position: 'top', color: '#e8ecf4', fontWeight: 'bold' }, z: 2 },
    ],
  });
  // 圓形頭像 + 名稱 below chart
  const avBox = document.getElementById('topFlyersAvatars');
  if (avBox) {
    avBox.innerHTML = data.map(d => `
      <div style="text-align:center;flex:0 0 auto">
        ${d.avatar
          ? `<img src="${d.avatar}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #4f8cff;box-shadow:0 2px 8px rgba(79,140,255,.3)"/>`
          : `<div style="width:52px;height:52px;border-radius:50%;background:#2a3a55;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#8fa0b8;font-size:18px;font-weight:bold">${d.name[0]}</div>`}
        <div style="color:#8fa0b8;font-size:11px;margin-top:4px;white-space:nowrap">${d.name}</div>
      </div>`).join('');
  }
  window.addEventListener('resize', () => chart.resize());
}

let currentFilter = 'all';
let currentSearch = '';
let currentSort = 'time_desc';

function discOf(t) {
  const origV = t.yListedHk != null ? Number(t.yListedHk) : null;
  const paidV = t.yHk != null ? Number(t.yHk) : null;
  return (origV && paidV && origV > 0) ? (1 - paidV / origV) * 100 : null;
}

function renderTickets(filter, search) {
  const list = document.getElementById('ticketList');
  let rows = [...DATA.tickets];
  if (filter === 'upcoming') rows = rows.filter(t => !t.finalStatus);
  else if (filter !== 'all') rows = rows.filter(t => (t.finalStatus || 'null') === filter);
  if (search) {
    const q = search.toLowerCase();
    rows = rows.filter(t =>
      (t.flightNumber || '').toLowerCase().includes(q) ||
      (t.from || '').toLowerCase().includes(q) ||
      (t.to || '').toLowerCase().includes(q) ||
      (t.displayName || '').toLowerCase().includes(q) ||
      (t.passengers || []).some(p => p.toLowerCase().includes(q))
    );
  }
  rows.sort((a, b) => {
    if (currentSort.startsWith('time')) {
      const d = (a.startTime || '').localeCompare(b.startTime || '');
      return currentSort === 'time_asc' ? d : -d;
    }
    const da = discOf(a), db = discOf(b);
    if (da == null && db == null) return 0;
    if (da == null) return 1;
    if (db == null) return -1;
    const d = da - db;
    return currentSort === 'disc_asc' ? d : -d;
  });
  if (!rows.length) { list.innerHTML = '<div class="empty">無符合記錄</div>'; return; }
  list.innerHTML = rows.map(t => ticketCard(t)).join('');
}

document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  renderTickets(currentFilter, currentSearch);
});

function ticketCard(t) {
  const st = t.finalStatus || 'null';
  const badge = st === 'null'
    ? '<span class="status-badge status-null">✈️ 即將起飛</span>'
    : `<span class="status-badge status-${st.replace(' ', '-')}">${st}</span>`;
  const pax = t.passengers.length
    ? t.passengers.map(p => {
        const paxObj = (DATA.passengers || []).find(x => x.name === p);
        const av = paxObj && paxObj.avatar ? paxObj.avatar : '';
        const avHtml = av ? `<img class="pax-avatar" src="${av}" onerror="this.style.display='none'" alt="">` : '';
        return `<span class="pax-chip">${avHtml}<span class="pax-link" onclick="jumpToPax('${p.replace(/'/g, "\\'")}')">${p}</span></span>`;
      }).join(' ')
    : '—';
  const origV = t.yListedHk != null ? Number(t.yListedHk) : null;
  const paidV = t.yHk != null ? Number(t.yHk) : null;
  const discount = (origV && paidV && origV > 0) ? Math.round((1 - paidV / origV) * 100) : null;
  const orig = fmtMoney(t.yListedHk);
  const paid = fmtMoney(t.yHk);
  const am = fmtMoney(t.yMilesHk);
  let barsHtml;
  if (!orig && !paid && !am) {
    barsHtml = '<div class="bar-null">無數據</div>';
  } else {
    const vals = [];
    if (orig != null) vals.push({ label: '原價', v: Number(orig.replace(/,/g,'').replace('$','')), cls: 'b-orig' });
    if (paid != null) vals.push({ label: '實付', v: Number(paid.replace(/,/g,'').replace('$','')), cls: 'b-paid' });
    if (am != null) vals.push({ label: 'AM', v: Number(am.replace(/,/g,'').replace('$','')), cls: 'b-am' });
    const maxV = Math.max(...vals.map(x => x.v), 1);
    barsHtml = `<div class="bar-chart">` + vals.map(x => {
      const h = Math.max(Math.round(x.v / maxV * 68), 3);
      return `<div class="bar-col"><div class="bar-val">$${Number(x.v).toLocaleString()}</div><div class="bar ${x.cls}" style="height:${h}px"></div><div class="bar-name">${x.label}</div></div>`;
    }).join('') + `</div>`;
  }
  const shots = t.screenshots || [];
  const shotsHtml = shots.length
    ? shots.map((s, i) => `<a onclick="openLightbox('${s}', ${i})">📷 截圖${shots.length>1 ? ' '+(i+1) : ''}</a>`).join('')
    : '';
  const discountHtml = discount != null
    ? `<div class="bar-discount">折扣 ${discount}%</div>`
    : `<div class="bar-discount none">折扣 —</div>`;
  const pendingEdits = getPaidEdits();
  const pendingAmt = pendingEdits[t.id];
  const effPaid = pendingAmt != null ? Number(pendingAmt) : paidV;
  let paidHtml;
  if (effPaid != null && !isNaN(effPaid)) {
    const tag = pendingAmt != null ? ' <span class="pending-tag">待推送</span>' : '';
    paidHtml = `<div class="tc-paid">💰 實付：<b>HK$${Number(effPaid).toLocaleString()}</b>${tag} <button class="edit-btn" onclick="editPaid('${t.id.replace(/'/g, "\\'")}')">✏️ 修改</button></div>`;
  } else {
    paidHtml = `<div class="tc-paid">💰 實付：<b style="color:var(--sub)">未填</b> <button class="edit-btn" onclick="editPaid('${t.id.replace(/'/g, "\\'")}')">✏️ 補實付</button></div>`;
  }
  return `
    <div class="ticket-card">
      <div class="tc-main">
        <div class="tc-top">
          <span class="tc-flight">${t.flightNumber || '—'}</span>
          ${badge}
        </div>
        <div class="tc-route">${t.from} → ${t.to}</div>
        <div class="tc-grid">
          <div>🕐 起飛：<b>${t.startTime || '—'}</b></div>
          <div>✈️ 機型：<b>${t.planeModel || '—'}</b></div>
          <div>👥 Capacity：<b>${t.capacity != null ? t.capacity : '—'}</b></div>

function getPaxRoutes(month) {
  const nameToId = {};
  DATA.passengers.forEach(p => { nameToId[p.name] = p.id; });
  const result = {};
  DATA.passengers.forEach(p => { result[p.id] = { name: p.name, appName: p.appName, routes: {}, flights: 0 }; });
  const allTickets = [...(DATA.tickets || []), ...(DATA.upcoming || [])];
  allTickets.forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (month && m !== month) return;
    (t.passengers || []).forEach(pn => {
      const id = nameToId[pn];
      if (id && result[id]) {
        const key = t.from + '-' + t.to;
        result[id].routes[key] = (result[id].routes[key] || 0) + 1;
        result[id].flights++;
      }
    });
  });
  return result;
}

function getAirportStats(month) {
  const stats = {};
  Object.keys(AIRPORTS).forEach(code => { stats[code] = { departures: 0, arrivals: 0, flights: 0, flightList: [] }; });
  const allTickets = [...(DATA.tickets || []), ...(DATA.upcoming || [])];
  allTickets.forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (month && m !== month) return;
    if (AIRPORTS[t.from]) {
      stats[t.from].departures++; stats[t.from].flights++;
      stats[t.from].flightList.push({ fn: t.flightNumber, route: `${t.from}→${t.to}`, time: t.startTime, status: t.finalStatus });
    }
    if (AIRPORTS[t.to]) {
      stats[t.to].arrivals++; stats[t.to].flights++;
      stats[t.to].flightList.push({ fn: t.flightNumber, route: `${t.from}→${t.to}`, time: t.startTime, status: t.finalStatus });
    }
  });
  return stats;
}

function getAllRoutes(month) {
  const routes = {};
  const allTickets = [...(DATA.tickets || []), ...(DATA.upcoming || [])];
  allTickets.forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (month && m !== month) return;
    const key = t.from + '-' + t.to;
    routes[key] = (routes[key] || 0) + 1;
  });
  return routes;
}

function buildMapOption(hasGeo) {
  const airportStats = getAirportStats(selectedMonth);
  const visCodes = visibleAirportCodes();
  const visSet = new Set(visCodes);
  const scatterData = visCodes.map(code => {
    const a = AIRPORTS[code];
    const s = airportStats[code];
    const isSel = code === selectedAirportCode;
    return { name: code, value: [a.lng, a.lat, s.flights], city: a.city, airport: a.name, departures: s.departures, arrivals: s.arrivals, flights: s.flights, sel: isSel };
  });
  let rawRoutes = null;
  if (selectedPax === 'ALL') rawRoutes = getAllRoutes(selectedMonth);
  else if (selectedPax) {
    const paxRoutes = getPaxRoutes(selectedMonth);
    const pr = paxRoutes[selectedPax];
    if (pr) rawRoutes = pr.routes;
  }
  let lineData = [];
  if (rawRoutes) {
    lineData = Object.keys(rawRoutes).map(key => {
      const [from, to] = key.split('-');
      return { fromName: from, toName: to, coords: [[AIRPORTS[from].lng, AIRPORTS[from].lat], [AIRPORTS[to].lng, AIRPORTS[to].lat]], count: rawRoutes[key] };
    }).filter(l => visSet.has(l.fromName) && visSet.has(l.toName));
  }
  if (selectedAirportCode !== 'ALL') {
    lineData = lineData.filter(l => l.fromName === selectedAirportCode || l.toName === selectedAirportCode);
  }
  const option = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: p => {
        if (p.seriesType === 'scatter') {
          const tag = p.data.sel ? ' ⭐ 已選' : '';
          return `<b>${p.name}</b>${tag} — ${p.data.city}<br>${p.data.airport}<br>航班總數：${p.data.flights} 班<br>出發：${p.data.departures} · 抵達：${p.data.arrivals}`;
        }
        if (p.seriesType === 'lines') {
          let src;
          if (selectedPax === 'ALL') src = getAllRoutes(selectedMonth);
          else { const paxRoutes = getPaxRoutes(selectedMonth); src = paxRoutes[selectedPax] ? paxRoutes[selectedPax].routes : {}; }
          const count = src[p.data.fromName + '-' + p.data.toName] || p.data.count;
          return `${p.data.fromName} → ${p.data.toName}<br>${count} 班`;
        }
        return p.name;
      }
    },
    geo: hasGeo ? { map: 'world', roam: true, zoom: 1.8, center: [100, 25], itemStyle: { areaColor: '#1a2233', borderColor: '#2e3a55', borderWidth: 0.5 }, emphasis: { itemStyle: { areaColor: '#212c42' }, label: { show: false } }, label: { show: false } } : null,
    series: [
      { name: '乘客航線', type: 'lines', coordinateSystem: hasGeo ? 'geo' : undefined, polyline: false, symbol: ['none', 'arrow'], symbolSize: 6, effect: { show: true, period: 4, trailLength: 0.3, symbol: 'arrow', symbolSize: 5, color: '#7eb0ff' }, lineStyle: { color: '#4f8cff', width: 2, opacity: 0.85, curveness: 0.15 }, data: lineData },
      { name: '機場', type: 'scatter', coordinateSystem: hasGeo ? 'geo' : undefined, symbol: 'path://' + PLANE_PATH, symbolSize: (v, params) => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? 34 : 22, symbolRotate: 0, itemStyle: { color: params => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? '#ff8c42' : '#ffc53d', shadowBlur: params => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? 18 : 10, shadowColor: params => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? 'rgba(255,140,66,0.8)' : 'rgba(255,197,61,0.6)' }, label: { show: true, formatter: '{b}', position: 'bottom', color: '#e8ecf4', fontSize: 11, fontWeight: 600 }, data: scatterData }
    ]
  };
  if (!hasGeo) {
    option.xAxis = { type: 'value', min: 60, max: 200, axisLabel: { color: '#8fa0b8' }, splitLine: { lineStyle: { color: '#1a2233' } } };
    option.yAxis = { type: 'value', min: -60, max: 60, axisLabel: { color: '#8fa0b8' }, splitLine: { lineStyle: { color: '#1a2233' } } };
  }
  mapChart.setOption(option, true);
  mapChart.off('click');
  mapChart.on('click', p => { if (p.seriesType === 'scatter' && p.data && p.data.name) showAirportDetail(p.data.name); });
  window.addEventListener('resize', () => mapChart.resize());
}

async function pushToLark() {
  const edits = getPaidEdits();
  const keys = Object.keys(edits);
  if (!keys.length) { alert('⚠️ 冇待推送嘅實付價錢。請先喺航班卡按「✏️ 補實付」輸入。'); return; }
  document.getElementById('pushModal').classList.add('show');
  const st = document.getElementById('pushStatus');
  st.className = 'modal-status';
  st.textContent = '提交到 Cloudflare Worker...';
  try {
    const resp = await fetch(J09_WORKER + '/api/paid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: edits, updatedAt: new Date().toISOString() }),
    });
    const j = await resp.json();
    if (j.ok > 0 && (!j.fail || j.fail === 0)) {
      st.className = 'modal-status ok';
      st.textContent = `✅ 全部成功！已更新 ${j.ok} 條記錄到飛書。`;
      // 即時將新實付值寫入內存 DATA，UI 即刻反映
      [...(DATA.tickets||[]), ...(DATA.upcoming||[])].forEach(t => {
        if (edits[t.id] != null) t.yHk = Number(edits[t.id]);
      });
      localStorage.setItem(PAID_EDIT_KEY, '{}');
      updateActionBar();
      renderTickets(currentFilter, currentSearch);
      setTimeout(closePushModal, 1500);
    } else if (j.ok > 0) {
      st.className = 'modal-status err';
      st.textContent = `⚠️ 部分完成：成功 ${j.ok} / 失敗 ${j.fail}` + (j.errors && j.errors.length ? '\n' + j.errors.slice(0, 3).join('\n') : '');
    } else {
      st.className = 'modal-status err';
      st.textContent = '❌ 失敗：' + (j.errors && j.errors[0] || j.error || resp.status);
    }
  } catch (e) {
    console.error('提交錯誤:', e);
    st.className = 'modal-status err';
    st.textContent = '❌ 錯誤：' + e.message;
  }
}

function esc(s) {

}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtDateObj(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function timeOf(it) {
  const s = it && it.start ? String(it.start) : '';
  const m = s.match(/(\d{2}:\d{2})/);
  return m ? m[1] : '—';
}
function slotOf(hh) {

  if (isNaN(h)) return '上午';
  if (h < 12) return '上午';
  if (h < 13) return '中午';

  return '晚上';

function dayLabels() { return (ITIN && ITIN.trip && ITIN.trip.dayLabels) || []; }
function dayDates() {
  const m = {};
  ((ITIN && ITIN.days) || []).forEach(d => { if (d.label && d.date) m[d.label] = d.date; });
  const t = (ITIN && ITIN.trip) || {};
  if (t.start && dayLabels().length) {
    const s = new Date(t.start + 'T00:00:00');
    if (!isNaN(s.getTime())) {
      dayLabels().forEach((l, i) => {
        if (!m[l]) { const d = new Date(s.getTime() + i * 86400000); m[l] = fmtDateObj(d); }
      });
    }
  }
  return m;
}
function dayIndex(lbl) { const i = dayLabels().indexOf(lbl); return i < 0 ? 99 : i; }
function cmpItem(a, b) {
  const d = dayIndex(a.day) - dayIndex(b.day);
  if (d) return d;
  const s = String(a.start || '').localeCompare(String(b.start || ''));
  if (s) return s;
  return (a.idx || 0) - (b.idx || 0);
}
function countDone() { return ((ITIN && ITIN.items) || []).filter(x => x.status === 'Completed').length; }
function countTotal() { return ((ITIN && ITIN.items) || []).length; }

function applyTripDraft() {
  if (!ITIN) return;
  const dates = dayDates();
  const ids = Object.keys(tripDraft);
  if (!ids.length) { rebuildDays(); return; }
  ids.forEach(id => {
    const it = (ITIN.items || []).find(x => x.id === id);
    if (!it) return;
    const dr = tripDraft[id] || {};
    const day = dr.day || it.day;
    const time = /^\d{2}:\d{2}$/.test(dr.time || '') ? dr.time : (timeOf(it) === '—' ? '09:00' : timeOf(it));
    it.day = day;
    it.date = dates[day] || it.date;
    it.slot = slotOf(time);
    it.start = (it.date || '') + ' ' + time;
    it.overnight = false;
  });
  rebuildDays();
}
function rebuildDays() {
  if (!ITIN) return;
  const labels = dayLabels().slice();
  const dates = dayDates();
  (ITIN.items || []).forEach(it => {
    const same = (ITIN.items || []).filter(x => x.day === it.day).sort((a, b) => String(a.start || '').localeCompare(String(b.start || '')));
    it.order = same.indexOf(it);
  });
  const dayArr = labels.map(l => ({ label: l, date: dates[l] || '', items: (ITIN.items || []).filter(x => x.day === l).sort((a, b) => String(a.start || '').localeCompare(String(b.start || ''))) }));
  ((ITIN.items || []).map(x => x.day)).forEach(d => { if (labels.indexOf(d) < 0) dayArr.push({ label: d, date: dates[d] || '', items: (ITIN.items || []).filter(x => x.day === d) }); });
  ITIN.days = dayArr;
  ITIN.items.sort(cmpItem);
  ITIN.itemsCount = (ITIN.items || []).length;
  ITIN.completedCount = countDone();
}

async function loadItinerary() {
  const wrap = document.getElementById('timeline');
  try {
    const res = await fetch('itinerary.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ITIN = await res.json();
    ITIN_RAW = JSON.parse(JSON.stringify(ITIN));
    tripDraft = tripDraftLoad();
    applyTripDraft();
    renderTripHeader();
    renderTripProgress();
    renderTimeline();
    renderNextCard();
    buildTripDaySelect();
    if (document.getElementById('panel-tripmap') && document.getElementById('panel-tripmap').classList.contains('active')) renderTripMap();
    updatePushBtn();
  } catch (e) {
    if (wrap) wrap.innerHTML = '<div class="tl-empty">❌ 無法載入 itinerary.json（' + esc(e.message) + '）</div>';
    console.error('itinerary 載入失敗', e);
  }
}
function reloadItinerary() { loadItinerary().then(() => toast('🔄 已重載 itinerary.json')); }
async function updateItineraryJson() {
  try {
    const r = await fetch(J09_WORKER + '/api/refresh', { method: 'POST' });
    const j = await r.json();
    if (j.dispatched) toast('✅ 已觸發 GitHub Actions 重生 itinerary.json（1–2 分鐘後按「🔄 重載行程」）', 4200);
    else toast('⚠️ 觸發失敗：' + (j.error || JSON.stringify(j)), 4200);
  } catch (e) { toast('❌ 觸發失敗：' + e.message, 4200); }
}

function updatePushBtn() {
  const btn = document.getElementById('itinPushBtn');

  const n = Object.keys(tripDraft).length;

function renderTripHeader() {
  const box = document.getElementById('tripHeader');
  if (!ITIN || !box) return;
  const t = ITIN.trip || {};
  const chips = [];
  if (t.party) chips.push('👥 ' + t.party);

function renderTripProgress() {
  const box = document.getElementById('tripProgress');
  if (!ITIN || !box) return;
  const items = ITIN.items || [];
  const total = items.length, done = countDone();
  const pct = total ? Math.round(done / total * 100) : 0;
  const labels = dayLabels();
  const bars = labels.map(l => {
    const ds = items.filter(x => x.day === l);
    const dn = ds.filter(x => x.status === 'Completed').length;
    const r = ds.length ? Math.round(dn / ds.length * 100) : 0;
    const isFull = ds.length && dn === ds.length;
    return '<div class="prog-day' + (tripDay === l ? ' active' : '') + '" onclick="setDayFilter(\'' + esc(l) + '\')" title="點擊只看 ' + esc(l) + '">' +
      '<div class="daybar' + (isFull ? ' full' : '') + (tripDay === l ? ' active' : '') + '"><div class="dfill' + (dn === 0 ? ' zero' : '') + '" style="height:' + (dn === 0 ? '4px' : Math.max(r, 2) + '%') + '"></div></div>' +
      '<div class="dayno">' + esc(String(l).replace('第', '').replace('天', '')) + '日</div>' +
      '<div class="daycnt">' + dn + '/' + ds.length + '</div></div>';
  }).join('');
  box.innerHTML = '<div class="prog-card"><div class="prog-inner">' +
    '<div class="prog-left"><div class="prog-num">' + pct + '%<small>完成</small></div>' +
    '<div class="prog-done">完成 ' + done + '/' + total + '</div>' +
    '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div></div>' +
    '<div class="prog-days">' + bars + '</div>' +
    '<div class="prog-hint">' + (tripDay ? '已只看 ' + esc(tripDay) + '，再點同一條棒取消' : '點每日細棒可只睇該日行程，再點一次取消') + '</div>' +
    '</div></div>';
}
function setDayFilter(lbl) {
  tripDay = (tripDay === lbl ? null : lbl);
  renderTripProgress();
  renderTimeline();
  const sel = document.getElementById('tripDaySelect');
  if (sel) sel.value = tripDay || 'ALL';
}

function nextItem() {
  if (!ITIN) return null;
  const pend = (ITIN.items || []).filter(x => x.status !== 'Completed');
  if (!pend.length) return null;
  pend.sort(cmpItem);
  return pend[0];
}
function renderNextCard() {
  const box = document.getElementById('nextCard');
  if (!ITIN || !box) return;
  const it = nextItem();
  if (!it) {
    box.innerHTML = '<div class="nc-label">✅ 行程完成</div><div class="nc-act">全部行程已完成，辛苦晒！</div>';
    return;
  }
  box.innerHTML =
    '<div class="nc-label">下一個行程</div>' +
    '<div class="nc-act">' + esc(it.activity || '—') + '</div>' +
    '<div class="nc-meta">' + esc(it.day || '') + ' · ' + esc(it.slot || '') + ' · 預計 ' + esc(timeOf(it)) + ' · 建議停留 ' + esc(it.stay || '—') + '</div>' +
    (it.note ? '<div class="nc-tip">⚠️ 提示：' + esc(it.note) + '</div>' : '') +
    '<div class="nc-timer" id="nextTimer">—</div>' +
    '<div class="nc-meta" style="margin-top:4px">計劃時間 ' + esc(it.start || '—') + '（未標記完成，計時以完成時刻為準）</div>';
  updateNextTimer();
  if (!nextTimerId) nextTimerId = setInterval(updateNextTimer, 1000);
}
function updateNextTimer() {
  const el = document.getElementById('nextTimer');
  const it = nextItem();
  if (!el || !it) return;
  const st = String(it.start || '').replace(' ', 'T');
  const start = new Date(st.length === 16 ? st + ':00' : st);
  if (isNaN(start.getTime())) { el.textContent = '—'; return; }
  const diff = start.getTime() - Date.now();
  if (diff > 0) {
    const dd = Math.floor(diff / 86400000), hh = Math.floor(diff % 86400000 / 3600000), mm = Math.floor(diff % 3600000 / 60000), ss = Math.floor(diff % 60000 / 1000);
    el.className = 'nc-timer';
    el.textContent = '⏳ 距開始 ' + (dd > 0 ? dd + ' 天 ' : '') + pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss);
  } else {
    const over = Math.floor(-diff / 86400000);
    el.className = 'nc-timer warn';
    el.textContent = over > 0 ? ('⏰ 逾期 ' + over + ' 天未完成') : ('⏰ 已逾時 ' + Math.floor(-diff / 3600000) + ' 小時未完成');
  }
}

function tripFiltered(items) {
  if (tripFilter === 'done') return items.filter(i => i.status === 'Completed');
  if (tripFilter === 'pending') return items.filter(i => i.status !== 'Completed');
  return items;
}
function renderTimeline() {
  const wrap = document.getElementById('timeline');
  if (!wrap) return;
  if (!ITIN) { wrap.innerHTML = '<div class="tl-empty">載入中…</div>'; return; }
  const days = (ITIN.days || []);
  const rows = [];
  days.forEach(d => {
    if (tripDay && d.label !== tripDay) return;
    const items = tripFiltered((d.items || []).slice().sort((a, b) => String(a.start || '').localeCompare(String(b.start || ''))));
    rows.push('<div class="tl-day"><h4>' + esc(d.label) + ' <span class="dt">' + esc(d.date || '') + '</span></h4>');
    if (!items.length) rows.push('<div class="tl-empty" style="padding:8px 0">當日暫無（符合篩選嘅）行程</div>');
    else items.forEach(it => rows.push(tlItemHtml(it)));
    rows.push('</div>');
  });
  wrap.innerHTML = rows.length ? rows.join('') : '<div class="tl-empty">冇行程</div>';
}
function metaBits(it) {
  const bits = [];
  if (it.stay) bits.push('建議停留 ' + esc(it.stay));
  if (it.budget != null && it.budget !== '') bits.push('預算 HK$' + esc(it.budget));
  if (it.taxiMin != null && it.taxiMin !== '') bits.push('🚕 ' + esc(it.taxiMin) + ' 分鐘');
  if (it.distKm != null && it.distKm !== '') bits.push('📏 ' + esc(it.distKm) + ' KM');
  if (it.place && (it.place.name || it.place.address)) bits.push('📍 ' + esc(it.place.name || it.place.address));
  return bits.map(b => '<span>' + b + '</span>').join('');
}
function tlItemHtml(it) {
  const done = it.status === 'Completed';
  const dr = tripDraft[it.id];
  const mapBtn = (it.place && it.place.lat != null) ? '<button class="tl-btn map" onclick="focusPlace(\'' + it.id + '\')">📍 地圖</button>' : '';
  const edit = (tripEditId === it.id) ? editPanelHtml(it) : '';
  return '<div class="tl-item' + (done ? ' done' : '') + '"><div class="tl-card">' +
    '<div class="tl-time">🕐 ' + esc(timeOf(it)) +
      (done ? '<span class="tl-draft ok">✅ 已完成</span>' : '') +
      (dr ? '<span class="tl-draft">✏️ 未推送</span>' : '') +
    '</div>' +
    '<div class="tl-act">' + esc(it.activity || '—') + '</div>' +
    (it.plan ? '<div class="tl-plan">' + esc(it.plan) + '</div>' : '') +
    (it.note ? '<div class="tl-note">⚠️ ' + esc(it.note) + '</div>' : '') +
    '<div class="tl-meta">' + metaBits(it) + '</div>' +
    '<div class="tl-btns">' +
      '<button class="tl-btn' + (done ? '' : ' done') + '" onclick="toggleTripItem(\'' + it.id + '\')">' + (done ? '↩ 取消完成' : '✅ 完成') + '</button>' +
      '<button class="tl-btn" onclick="startTripEdit(\'' + it.id + '\')">✏️ 修改</button>' +
      mapBtn +
      (dr ? '<button class="tl-btn" onclick="revertTripEdit(\'' + it.id + '\')">↩ 還原</button>' : '') +
    '</div>' + edit + '</div></div>';
}
function editPanelHtml(it) {
  const labels = dayLabels().length ? dayLabels() : ['第1天'];
  const cur = timeOf(it) === '—' ? '09:00' : timeOf(it);
  return '<div class="tl-edit">' +
    '<div class="erow"><span class="fl-label">天數</span>' +
      '<select id="editDay_' + it.id + '">' + labels.map(l => '<option value="' + esc(l) + '"' + (l === it.day ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>' +
      '<span class="fl-label">時間</span>' +
      '<input type="time" id="editTime_' + it.id + '" step="900" value="' + esc(cur) + '">' +
    '</div>' +
    '<div class="erow">' +
      '<button class="tl-btn done" onclick="saveTripEdit(\'' + it.id + '\')">💾 儲存（暫存本機）</button>' +
      '<button class="tl-btn" onclick="cancelTripEdit()">✖ 取消</button>' +
      '<button class="tl-btn" onclick="revertTripEdit(\'' + it.id + '\')">↩ 還原飛書值</button>' +
    '</div>' +
    '<div class="e-hint">改動只暫存喺瀏覽器（localStorage），按頂部「⬆️ 推送更改」才會寫回飛書 → 重生 JSON。</div>' +
  '</div>';
}
function startTripEdit(id) { tripEditId = id; renderTimeline(); }
function cancelTripEdit() { tripEditId = null; renderTimeline(); }
function saveTripEdit(id) {
  const dEl = document.getElementById('editDay_' + id);
  const tEl = document.getElementById('editTime_' + id);
  const day = dEl ? dEl.value : '';
  let time = tEl ? tEl.value : '';
  if (!day || !time) { toast('⚠️ 請填天數同時間'); return; }
  if (!/^\d{1,2}:\d{2}$/.test(time)) { toast('⚠️ 時間格式要 HH:MM'); return; }
  time = pad2(parseInt(time.split(':')[0], 10)) + ':' + time.split(':')[1];
  tripDraft[id] = { day: day, time: time };
  tripDraftSave();
  applyTripDraft();
  tripEditId = null;
  renderTripHeader(); renderTimeline(); renderNextCard(); renderTripProgress(); renderTripMap();
  toast('✏️ 已暫存本機（未推送）');
}
function revertTripEdit(id) {
  delete tripDraft[id];
  tripDraftSave();
  const raw = ((ITIN_RAW && ITIN_RAW.items) || []).find(x => x.id === id);
  const cur = ((ITIN && ITIN.items) || []).find(x => x.id === id);
  if (raw && cur) {
    cur.day = raw.day; cur.date = raw.date; cur.slot = raw.slot;
    cur.start = raw.start; cur.overnight = raw.overnight; cur.order = raw.order;
  }
  rebuildDays();
  renderTripHeader(); renderTimeline(); renderNextCard(); renderTripProgress(); renderTripMap();
  toast('↩ 已還原飛書值');
}

async function toggleTripItem(id) {
  if (!ITIN) return;
  const it = (ITIN.items || []).find(x => x.id === id);
  if (!it) return;
  const next = (it.status === 'Completed') ? 'Pending' : 'Completed';
  it.status = next;
  ITIN.completedCount = countDone();
  renderTripHeader(); renderTimeline(); renderNextCard(); renderTripProgress();
  try {
    const r = await fetch(J09_WORKER + '/api/plan-status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: (function () { const o = {}; o[id] = next; return o; })() })
    });
    const j = await r.json();
    if (j.ok === 0 || j.error) throw new Error((j.errors && j.errors[0]) || j.error || '寫回失敗');
    const rawIt = ((ITIN_RAW && ITIN_RAW.items) || []).find(x => x.id === id);
    if (rawIt) rawIt.status = next;
    toast(next === 'Completed' ? '✅ 已標記完成（已寫回飛書）' : '↩ 已取消完成（已寫回飛書）');
  } catch (e) {
    it.status = (next === 'Completed') ? 'Pending' : 'Completed';
    ITIN.completedCount = countDone();
    renderTripHeader(); renderTimeline(); renderNextCard(); renderTripProgress();
    toast('❌ 同步失敗：' + e.message, 3600);
  }
}

async function pushTripEdits() {
  const ids = Object.keys(tripDraft);
  if (!ids.length) { toast('冇待推送嘅改動'); return; }
  const btn = document.getElementById('itinPushBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 寫回飛書中…'; }
  try {
    const records = {};
    ids.forEach(id => { records[id] = { day: tripDraft[id].day, time: tripDraft[id].time }; });
    const r = await fetch(J09_WORKER + '/api/plan-edit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: records })
    });
    const j = await r.json();
    if (!j.ok) throw new Error((j.errors && j.errors[0]) || j.error || '寫回飛書失敗');
    ids.forEach(id => {
      const rawIt = ((ITIN_RAW && ITIN_RAW.items) || []).find(x => x.id === id);
      const cur = ((ITIN && ITIN.items) || []).find(x => x.id === id);
      if (rawIt && cur) { rawIt.day = cur.day; rawIt.date = cur.date; rawIt.slot = cur.slot; rawIt.start = cur.start; rawIt.order = cur.order; }
    });
    tripDraft = {};
    tripDraftSave();
    renderTimeline(); renderTripProgress(); renderNextCard(); renderTripHeader();
    toast('✅ 已寫回飛書 ' + j.ok + ' 條，開始重生 JSON…', 3600);
    try {
      const rr = await fetch(J09_WORKER + '/api/refresh', { method: 'POST' });
      const jj = await rr.json();
      if (jj.dispatched) toast('✅ 已觸發 GitHub Actions，1–2 分鐘後按「🔄 重載行程」', 5200);
      else toast('⚠️ JSON 重生觸發失敗：' + (jj.error || ''), 5200);
    } catch (e2) { toast('⚠️ JSON 重生觸發失敗：' + e2.message, 5200); }
  } catch (e) {
    toast('❌ 推送失敗：' + e.message, 5200);
  } finally {
    if (btn) btn.disabled = false;
    updatePushBtn();
  }
}

/* ---------- 行程圖（Leaflet） ---------- */
function buildTripDaySelect() {
  const sel = document.getElementById('tripDaySelect');
  if (!sel || !ITIN) return;
  sel.innerHTML = '<option value="ALL">全部天數</option>' + dayLabels().map(l => '<option value="' + esc(l) + '">' + esc(l) + '</option>').join('');
  sel.value = tripDay || 'ALL';
}
function initTripMap() {
  const el = document.getElementById('tripMap');
  if (!el || typeof L === 'undefined') return;
  tripMap = L.map(el, { scrollWheelZoom: true, zoomControl: true }).setView([34.0, 110.0], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap contributors'
  }).addTo(tripMap);
  tripLayerGroup = L.layerGroup().addTo(tripMap);
  tripFitted = false;
}
function tripPalette(i) {
  const p = ['#4f8cff', '#3dd68c', '#ffc53d', '#ff8c42', '#c084fc', '#38bdf8', '#f472b6'];
  return p[(i < 0 ? 0 : i) % p.length];
}
function renderTripMap() {
  if (!ITIN) return;
  if (!tripMap) initTripMap();
  if (!tripMap) return;
  if (tripLayerGroup) tripLayerGroup.clearLayers(); else tripLayerGroup = L.layerGroup().addTo(tripMap);
  tripMarkers = {};
  const list = [];
  (ITIN.items || []).forEach(it => {
    if (!it.place || it.place.lat == null || it.place.lng == null) return;
    if (tripDay && it.day !== tripDay) return;
    const color = tripPalette(dayIndex(it.day));
    const m = L.circleMarker([it.place.lat, it.place.lng], {
      radius: 7, color: '#0f1420', weight: 2, fillColor: color, fillOpacity: 1
    }).bindPopup('<b>' + esc(it.activity || '') + '</b><br>' + esc(it.day || '') + ' · ' + esc(timeOf(it)) + '<br>' + esc(it.place.name || it.place.address || ''));
    m.on('click', () => highlightPlace(it.id));
    m.addTo(tripLayerGroup);
    tripMarkers[it.id] = m;
    list.push(it);
  });
  renderPlaceList(list);
  const sel = (ITIN.items || []).find(x => x.id === tripSel);
  if (sel && tripMarkers[sel.id]) tripMarkers[sel.id].openPopup();
  if (!tripFitted && tripDay === null) { fitTrip(); tripFitted = true; }
}
function renderPlaceList(list) {
  const box = document.getElementById('tripPlaceList');
  if (!box) return;
  if (!list.length) { box.innerHTML = '<div class="tl-empty">此範圍未有座標景點</div>'; return; }
  box.innerHTML = list.map(it =>
    '<div class="place-row' + (tripSel === it.id ? ' on' : '') + '" onclick="focusPlace(\'' + it.id + '\')">' +
      '<div class="dot" style="background:' + tripPalette(dayIndex(it.day)) + '"></div>' +
      '<div style="flex:1;min-width:0"><div class="pr-act">' + esc(it.activity || '') + '</div>' +
      '<div class="pr-sub">' + esc(it.day || '') + ' · ' + esc(timeOf(it)) + ' · ' + esc((it.place && (it.place.name || it.place.address)) || '') + '</div></div>' +
    '</div>').join('');
}
function focusPlace(id) {
  tripSel = id;
  switchTab('tripmap');
  const it = ((ITIN && ITIN.items) || []).find(x => x.id === id);
  if (!it || !it.place) return;
  setTimeout(() => {
    if (!tripMap) initTripMap();
    renderTripMap();
    highlightPlace(id);
  }, 120);
}
function highlightPlace(id) {
  const m = tripMarkers[id];
  if (!m || !tripMap) return;
  tripSel = id;
  m.openPopup();
  tripMap.setView(m.getLatLng(), Math.max(tripMap.getZoom(), 13), { animate: true });
  renderPlaceList((ITIN.items || []).filter(it => it.place && it.place.lat != null && (!tripDay || it.day === tripDay)));
}
function fitTrip() {
  if (!tripMap) { initTripMap(); if (!tripMap) return; }
  const pts = Object.keys(tripMarkers).map(k => tripMarkers[k].getLatLng());
  if (!pts.length) { tripMap.setView([34.0, 110.0], 4); return; }
  const b = L.latLngBounds(pts);
  tripMap.invalidateSize();
  tripMap.fitBounds(b, { padding: [30, 30], maxZoom: 14 });
  tripFitted = true;
}
function fitTripZoom() {
  if (!tripMap) return;
  const pts = Object.keys(tripMarkers).map(k => tripMarkers[k].getLatLng());
  if (!pts.length) return;
  const sel = tripSel !== 'ALL' ? tripMarkers[tripSel] : null;
  if (sel) { tripMap.setView(sel.getLatLng(), 15); return; }
  fitTrip();
  setTimeout(() => { if (tripMap) tripMap.setZoom(Math.min(tripMap.getZoom() + 2, 17)); }, 200);
}

/* ---------- 事件綁定 ---------- */
document.querySelectorAll('.trip-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.trip-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tripFilter = btn.dataset.trip;
    renderTimeline();
  });
});
(function () {
  const sel = document.getElementById('tripDaySelect');
  if (sel) sel.addEventListener('change', e => {
    tripDay = (e.target.value === 'ALL' ? null : e.target.value);
    renderTimeline(); renderTripProgress(); renderTripMap();
  });
})();

loadItinerary();
</script>

  <div class="lightbox-img-wrap" id="lightboxWrap">
    <img class="lightbox-img" id="lightboxImg" src="" alt="截圖">
  </div>
  <div class="lightbox-hint">滾輪縮放 · 拖動平移 · ESC 關閉</div>
</div>

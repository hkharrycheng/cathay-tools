<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>國泰員工機票 - Cathay Staff Tickets</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
/* ===== 截圖 lightbox（fullscreen zoom/pan） ===== */
let lbScale = 1, lbTx = 0, lbTy = 0, lbImg = null, lbWrap = null;
function openLightbox(src) {
  lbImg = document.getElementById('lightboxImg');
  lbWrap = document.getElementById('lightboxWrap');
  document.getElementById('lightbox').classList.add('open');
  lbImg.src = src;
  lbScale = 1; lbTx = 0; lbTy = 0;
  applyLbTransform();
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e, force) {
  if (!force && e && e.target.tagName === 'IMG') return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function applyLbTransform() {
  if (lbImg) lbImg.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
}
document.addEventListener('DOMContentLoaded', () => {
  const lb = document.getElementById('lightbox');
  lb.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.15 : 0.87;
    lbScale = Math.min(6, Math.max(0.5, lbScale * delta));
    applyLbTransform();
  }, { passive: false });
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  lb.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = lbTx; oy = lbTy;
    lbWrap.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    lbTx = ox + (e.clientX - sx); lbTy = oy + (e.clientY - sy);
    applyLbTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; lbWrap.classList.remove('dragging'); });
  let tStart = null;
  lb.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) { tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, ox: lbTx, oy: lbTy }; }
  }, { passive: true });
  lb.addEventListener('touchmove', (e) => {
    if (tStart && e.touches.length === 1) {
      e.preventDefault();
      lbTx = tStart.ox + (e.touches[0].clientX - tStart.x);
      lbTy = tStart.oy + (e.touches[0].clientY - tStart.y);
      applyLbTransform();
    }
  }, { passive: false });
  lb.addEventListener('touchend', () => { tStart = null; });
  lb.addEventListener('dblclick', (e) => {
    if (e.target.tagName === 'IMG') {
      if (lbScale > 1.1) { lbScale = 1; lbTx = 0; lbTy = 0; }
      else { lbScale = 2.5; }
      applyLbTransform();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
});
</script>
<style>
:root {
  --bg: #0f1420;
  --card: #1a2233;
  --card2: #212c42;
  --border: #2e3a55;
  --text: #e8ecf4;
  --sub: #8fa0b8;
  --accent: #4f8cff;
  --green: #3dd68c;
  --red: #ff5d6c;
  --yellow: #ffc53d;
  --gold: #ffd700;
  --tabbar-h: 56px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: var(--tabbar-h);
}
.container { max-width: 1400px; margin: 0 auto; padding: 14px 14px 20px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; padding-top: 8px; }
.header h1 {
  font-size: 22px;
  background: linear-gradient(135deg, #7eb0ff, #4f8cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex; align-items: center; gap: 10px;
}
.header .logo { width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; }
.header .meta { color: var(--sub); font-size: 12px; text-align: right; }
.header .meta .version { color: var(--accent); font-weight: bold; }
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--tabbar-h);
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: transparent; border: none; color: var(--sub); font-size: 11px; cursor: pointer;
  transition: color 0.2s;
}
.tab-btn .tab-icon { font-size: 20px; line-height: 1; }
.tab-btn.active { color: var(--accent); }
.tab-btn.active .tab-icon { transform: scale(1.15); }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.25s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 12px; text-align: center; position: relative; overflow: hidden;
}
.stat-card .label { color: var(--sub); font-size: 12px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-card .value { font-size: 24px; font-weight: 700; }
.stat-card .sub-label { color: var(--sub); font-size: 10px; margin-top: 3px; }
.stat-card.green .value { color: var(--green); }
.stat-card.red .value { color: var(--red); }
.stat-card.blue .value { color: var(--accent); }
.stat-card.gold .value { color: var(--gold); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); }
.stat-card.green::before { background: var(--green); }
.stat-card.red::before { background: var(--red); }
.stat-card.gold::before { background: var(--gold); }
@media (min-width: 800px) {
  .stats-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .charts-grid { grid-template-columns: 1fr 1fr; }
}
.charts-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.chart-card h3 { font-size: 14px; color: var(--sub); margin-bottom: 8px; }
.chart-box { width: 100%; height: 240px; }
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; }
.upcoming-section { margin-bottom: 14px; }
.filter-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.search-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 7px 14px; color: var(--text); font-size: 13px; outline: none; width: 100%;
}
.search-box:focus { border-color: var(--accent); }
.sort-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.sort-row .fl-label { padding-top: 0; }
.combo {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 8px; font-size: 12px; outline: none;
  flex: 1; min-width: 110px; max-width: 240px;
}
.combo:focus { border-color: var(--accent); }
.combo option { background: var(--card); color: var(--text); }
.ticket-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 8px;
  display: flex; gap: 10px; align-items: stretch;
}
.tc-main { flex: 1; min-width: 0; }
.tc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
.tc-flight { font-size: 16px; font-weight: 700; }
.tc-route { color: var(--accent); font-size: 13px; margin-bottom: 6px; }
.tc-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 3px 10px;
  font-size: 11px;
  color: var(--sub);
}
.tc-grid b { color: var(--text); font-weight: 600; }
.tc-pax { margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--border); color: var(--sub); font-size: 11px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tc-pax b { color: var(--text); }
.pax-chip { display: inline-flex; align-items: center; gap: 4px; }
.pax-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); vertical-align: middle; background: #2a3550; }
.status-badge { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.status-Accepted { background: rgba(61,214,140,0.15); color: var(--green); }
.status-Rejected { background: rgba(255,93,108,0.15); color: var(--red); }
.status-No-Show { background: rgba(255,197,61,0.15); color: var(--yellow); }
.status-null { background: rgba(79,140,255,0.15); color: var(--accent); }
.tc-bars { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; padding-left: 10px; border-left: 1px solid var(--border); }
.bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 74px; }
.bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar-val { font-size: 9px; font-weight: 700; color: var(--text); margin-bottom: 2px; white-space: nowrap; }
.bar {
  width: 16px; border-radius: 3px 3px 0 0;
  background: var(--accent);
  position: relative;
  min-height: 2px;
}
.bar.b-orig { background: linear-gradient(180deg, #4f8cff, #2d5fc0); }
.bar.b-paid { background: linear-gradient(180deg, #3dd68c, #1f9e63); }
.bar.b-am   { background: linear-gradient(180deg, #ffc53d, #d99a1f); }
.bar-name { font-size: 9px; color: var(--sub); margin-top: 3px; }
.bar-null { font-size: 9px; color: var(--sub); height: 74px; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
.bar-discount { font-size: 11px; color: var(--green); margin-top: 6px; font-weight: 700; white-space: nowrap; }
.bar-discount.none { color: var(--sub); font-weight: 400; }
.pax-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
.pax-link:active { color: #7eb0ff; }
.map-filters { margin-bottom: 12px; }
.filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.fl-label { font-size: 12px; color: var(--sub); white-space: nowrap; flex-shrink: 0; font-weight: 600; }
.month-slider { flex: 1; min-width: 80px; max-width: 150px; accent-color: var(--accent); }
.month-label { font-size: 12px; color: var(--accent); font-weight: 700; min-width: 56px; text-align: center; white-space: nowrap; }
.mini-btn {
  background: var(--card); color: var(--sub); border: 1px solid var(--border);
  border-radius: 10px; padding: 5px 10px; font-size: 11px; cursor: pointer; transition: all 0.2s;
  flex-shrink: 0;
}
.mini-btn:hover { border-color: var(--accent); color: var(--text); }
.mini-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.map-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px; margin-bottom: 10px; overflow: hidden; }
#mapChart { width: 100%; height: 360px; }
.airport-detail-panel {
  background: var(--card2); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; margin-bottom: 10px; display: none;
}
.airport-detail-panel.show { display: block; }
.airport-detail-panel .adp-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.airport-detail-panel .adp-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); padding: 4px 0; border-bottom: 1px dashed var(--border); }
.airport-detail-panel .adp-row b { color: var(--text); }
.airport-detail-panel .adp-flights { margin-top: 8px; }
.airport-detail-panel .adp-flight {
  font-size: 11px; color: var(--sub); padding: 4px 0; border-bottom: 1px dashed var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.airport-detail-panel .adp-flight b { color: var(--text); }
.action-bar { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.action-btn {
  flex: 1; min-width: 110px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.action-btn:active { transform: scale(0.97); }
.action-btn.has-pending { border-color: #ffc53d; color: #ffc53d; }
.tc-paid { margin-top: 6px; font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tc-paid b { color: var(--text); }
.edit-btn {
  padding: 3px 10px; border-radius: 8px; border: 1px solid #4f8cff; background: rgba(79,140,255,0.12);
  color: #7eb0ff; font-size: 11px; font-weight: 600; cursor: pointer;
}
.edit-btn:active { transform: scale(0.95); }
.pending-tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(255,197,61,0.15); color: #ffc53d; font-weight: 600; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
  align-items: center; justify-content: center; z-index: 999; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  width: 100%; max-width: 360px; background: var(--card2); border: 1px solid var(--border);
  border-radius: 16px; padding: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.modal-box h3 { font-size: 15px; margin: 0 0 10px; color: var(--text); }
.modal-box p { font-size: 12px; color: var(--sub); margin: 6px 0 10px; line-height: 1.5; }
.modal-box input[type=password], .modal-box input[type=number] {
  width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px;
}
.modal-box .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
.modal-btn {
  flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer;
}
.modal-btn.primary { background: #4f8cff; color: #fff; }
.modal-btn.secondary { background: var(--border); color: var(--text); }
.modal-btn.danger { background: rgba(255,93,108,0.15); color: #ff5d6c; border: 1px solid #ff5d6c; }
.modal-btn:disabled { opacity: 0.5; }
.modal-status { font-size: 11px; margin-top: 8px; min-height: 16px; color: var(--sub); }
.modal-status.ok { color: #3dd68c; }
.modal-status.err { color: #ff5d6c; }
.footer { text-align: center; color: var(--sub); font-size: 11px; padding: 16px 0 8px; }
.empty { color: var(--sub); text-align: center; padding: 24px; font-size: 13px; }
.tc-shot { margin-top: 5px; font-size: 11px; }
.tc-shot a {
  display: inline-block; padding: 2px 8px; border-radius: 8px;
  background: rgba(79,140,255,0.12); color: var(--accent);
  cursor: pointer; text-decoration: none; margin-right: 6px;
}
.tc-shot a:hover { background: rgba(79,140,255,0.25); }
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 9999; display: none; overflow: hidden;
}
.lightbox.open { display: block; }
.lightbox-img-wrap {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  cursor: grab; user-select: none;
}
.lightbox-img-wrap.dragging { cursor: grabbing; }
.lightbox-img {
  max-width: 100%; max-height: 100%;
  transform-origin: center center;
  transition: transform 0.05s linear;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
}
.lightbox-close {
  position: absolute; top: 16px; right: 20px; z-index: 10;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: #fff;
  border: none; font-size: 22px; cursor: pointer;
}
.lightbox-close:hover { background: rgba(255,255,255,0.3); }
.lightbox-hint {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.6); font-size: 12px; z-index: 10;
  background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 12px;
}
</style>
</head>

<div class="container">
  <div class="header">
    <h1>
      <img class="logo" src="cathay-logo.png" alt="Cathay">
      國泰員工機票
    </h1>
    <div class="meta">
      <div><span class="version" id="version">v1.14</span> &nbsp;|&nbsp; 更新：<span id="lastUpdate">-</span></div>
    </div>
  </div>
</div>

<div class="tab-panel active" id="panel-flights">
  <div class="container">
    <div class="section-title">📋 全部航班記錄</div>
    <div class="action-bar">
      <button class="action-btn" id="pushBtn" onclick="pushToLark()">📤 推送實付到飛書</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="upcoming">✈️ 即將起飛</button>
      <button class="filter-btn" data-filter="Accepted">Accepted</button>
      <button class="filter-btn" data-filter="Rejected">Rejected</button>
      <button class="filter-btn" data-filter="No Show">No Show</button>
    </div>
    <div class="sort-row">
      <span class="fl-label">排序</span>
      <select id="sortSelect" class="combo">
        <option value="time_desc" selected>🕐 起飛時間 ↓（最新先）</option>
        <option value="time_asc">🕐 起飛時間 ↑（最早先）</option>
        <option value="disc_desc">💰 折扣% ↓（最大先）</option>
        <option value="disc_asc">💰 折扣% ↑（最小先）</option>
      </select>
    </div>

    <div id="ticketList" style="margin-top:10px"></div>

      <div class="chart-card">

      </div>
      <div class="chart-card">
        <h3>Rolling Probability 趨勢</h3>
        <div class="chart-box" id="lineChart"></div>
      </div>
    </div>
    <div class="footer">Cathay Staff Tickets · J09</div>
  </div>
</div>

<div class="tab-panel" id="panel-map">
  <div class="container">
    <div class="section-title">🌍 世界地圖 · 乘客航線</div>
    <div class="map-filters">
      <div class="filter-row">
        <span class="fl-label">👥 乘客</span>
        <select id="paxSelect" class="combo">
          <option value="">（無）不顯示航線</option>
        </select>
        <span class="fl-label">🗺 機場</span>
        <select id="airportSelect" class="combo">
          <option value="ALL">全部</option>
        </select>
      </div>
      <div class="filter-row">

          <option value="EU">🏰 歐洲</option>
          <option value="MEA">🕌 中東及非洲</option>
          <option value="AM">🌎 美洲</option>

    </div>

      <div id="mapChart"></div>
    </div>

    <div class="footer">Cathay Staff Tickets · J09</div>

    <span>航班</span>

    <span class="tab-icon">📊</span>
    <span>統計</span>

  <button class="tab-btn" data-tab="map">
    <span class="tab-icon">🌍</span>
    <span>地圖</span>
  </button>
</nav>

<div class="modal-overlay" id="pushModal" onclick="if(event.target===this)closePushModal()">
  <div class="modal-box">
    <h3>📤 推送實付到飛書</h3>
    <div class="modal-status" id="pushStatus"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closePushModal()">關閉</button>
    </div>
  </div>
</div>

<script>
let DATA = null;
const AIRPORTS = {
  HKG: { name: '香港國際機場', city: '香港', lat: 22.3080, lng: 113.9145, region: 'NEA' },
  KIX: { name: '關西國際機場', city: '大阪', lat: 34.4347, lng: 135.2300, region: 'NEA' },
  TAO: { name: '青島膠東國際機場', city: '青島', lat: 37.3918, lng: 120.0864, region: 'NEA' },
  NRT: { name: '成田國際機場', city: '東京', lat: 35.7647, lng: 140.3864, region: 'NEA' },
  URC: { name: '烏魯木齊天山國際機場', city: '烏魯木齊', lat: 43.9071, lng: 87.4742, region: 'NEA' },
  YVR: { name: '溫哥華國際機場', city: '溫哥華', lat: 49.1967, lng: -123.1816, region: 'AM' },
  ICN: { name: '仁川國際機場', city: '首爾', lat: 37.4602, lng: 126.4407, region: 'NEA' },
  DPS: { name: '伍拉·賴國際機場', city: '峇里島', lat: -8.7482, lng: 115.1675, region: 'SEA' },
  SYD: { name: '金斯福德·史密斯機場', city: '雪梨', lat: -33.9461, lng: 151.1772, region: 'SEA' }
};
const REGION_LABEL = { SEA: '東南亞及澳洲', NEA: '東北亞', EU: '歐洲', MEA: '中東及非洲', AM: '美洲' };
const PLANE_PATH = 'M21,16v-2l-8,-5V3.5C13,2.67 12.33,2 11.5,2S10,2.67 10,3.5V9l-8,5v2l8,-2.5V19l-2,1.5V22l3.5,-1 3.5,1v-1.5L13,19v-5.5L21,16z';
let mapChart = null;
let mapHasGeo = true;
let selectedPax = null;
let selectedAirportCode = 'ALL';
let selectedRegion = 'ALL';
let selectedMonth = null;
let monthsList = [];

async function loadData() {
  try {
    const res = await fetch('cathay.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    renderAll();
  } catch (e) {
    console.error('載入失敗:', e);
    document.getElementById('statsGrid').innerHTML = '<div class="empty">❌ 無法載入 cathay.json（' + e.message + '）</div>';
  }
}

function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }
function fmtMoney(v) { return v != null && !isNaN(v) ? '$' + Number(v).toLocaleString() : null; }

function renderAll() {
  document.getElementById('version').textContent = 'v' + DATA.version;
  document.getElementById('lastUpdate').textContent = DATA.lastUpdate;
  renderStats();
  renderPie();
  renderLine();
  renderTopFlyers();
  renderTickets('all', '');
  renderPaxCombo();
  renderAirportCombo();
  setupMonthSlider();
  renderMap();
  updateActionBar();
}

function renderStats() {
  const s = DATA.stats;
  const cards = [
    { label: '航班總數', value: s.noOfFlights, sub: '（有狀態）', cls: 'blue' },
    { label: '% Successful', value: fmtPct(s.successRate), sub: s.successful + ' 班 Accepted', cls: 'green' },
    { label: 'Avg Booked', value: fmtPct(s.avgBooked), sub: '平均訂位率', cls: 'blue' },
    { label: 'Avg Staff %', value: fmtPct(s.avgStaffPercent), sub: '平均員工比例', cls: 'gold' },
    { label: 'Avg Discount', value: fmtPct(s.avgDiscount), sub: '平均折扣', cls: 'green' },
    { label: 'Avg Standby', value: s.avgStaffCount, sub: '平均候補人數', cls: 'blue' }
  ];
  document.getElementById('statsGrid').innerHTML = cards.map(c =>
    `<div class="stat-card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub-label">${c.sub}</div></div>`
  ).join('');
}

function renderPie() {
  const chart = echarts.init(document.getElementById('pieChart'));
  const dist = DATA.stats.statusDist;
  const colors = { Accepted: '#3dd68c', Rejected: '#ff5d6c', 'No Show': '#ffc53d' };
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', formatter: '{b}: {c} 班 ({d}%)' },
    legend: { bottom: 0, textStyle: { color: '#8fa0b8' } },
    series: [{
      type: 'pie', radius: ['45%', '70%'], center: ['50%', '45%'],
      itemStyle: { borderRadius: 6, borderColor: '#1a2233', borderWidth: 2 },
      label: { color: '#e8ecf4', formatter: '{b}\n{c} 班' },
      data: dist.map(d => ({ name: d.status, value: d.count, itemStyle: { color: colors[d.status] || '#4f8cff' } }))
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderLine() {
  const chart = echarts.init(document.getElementById('lineChart'));
  const rolling = DATA.rollingProb;
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    grid: { left: 45, right: 20, top: 20, bottom: 40 },
    xAxis: { type: 'category', data: rolling.map(r => r.time), axisLabel: { color: '#8fa0b8', rotate: 30, fontSize: 10 }, axisLine: { lineStyle: { color: '#2e3a55' } } },
    yAxis: { type: 'value', min: 0, max: 1, axisLabel: { color: '#8fa0b8', formatter: v => (v * 100).toFixed(0) + '%' }, splitLine: { lineStyle: { color: '#1a2233' } } },
    series: [{ type: 'line', data: rolling.map(r => r.prob), smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { color: '#4f8cff', width: 3 }, itemStyle: { color: '#4f8cff' }, areaStyle: { color: 'rgba(79,140,255,0.15)' } }]
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderTopFlyers() {
  const el = document.getElementById('topFlyersChart');
  if (!el || !DATA.topFlyers || !DATA.topFlyers.length) return;
  const chart = echarts.init(el);
  const data = DATA.topFlyers.slice();
  const names = data.map(d => d.name);
  const values = data.map(d => d.flights);
  const maxV = Math.max(...values);
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis', formatter: p => p[0].name + ': ' + p[0].value + ' 班' },
    grid: { left: 50, right: 20, top: 50, bottom: 40 },
    xAxis: { type: 'category', data: names, axisLabel: { color: '#8fa0b8', fontSize: 11, interval: 0, rotate: names.length > 6 ? 20 : 0 }, axisLine: { lineStyle: { color: '#2e3a55' } } },
    yAxis: { type: 'value', minInterval: 1, max: maxV + 1.5, axisLabel: { color: '#8fa0b8' }, splitLine: { lineStyle: { color: '#1a2233' } } },
    series: [
      { type: 'bar', data: values, barMaxWidth: 50, itemStyle: { borderRadius: [6, 6, 0, 0], color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#4f8cff' }, { offset: 1, color: '#2a56c9' }] } }, label: { show: true, position: 'top', color: '#e8ecf4', fontWeight: 'bold' }, z: 2 },
      { type: 'scatter', data: data.map((d, i) => [i, d.flights + 0.9]), symbolSize: 40, symbol: (val, params) => { const d = data[params.dataIndex]; return d.avatar || 'image://'; }, itemStyle: { borderColor: '#fff', borderWidth: 1 }, z: 3, silent: true }
    ],
  });
  window.addEventListener('resize', () => chart.resize());
}

let currentFilter = 'all';
let currentSearch = '';
let currentSort = 'time_desc';

function discOf(t) {
  const origV = t.yListedHk != null ? Number(t.yListedHk) : null;
  const paidV = t.yHk != null ? Number(t.yHk) : null;
  return (origV && paidV && origV > 0) ? (1 - paidV / origV) * 100 : null;
}

function renderTickets(filter, search) {
  const list = document.getElementById('ticketList');
  let rows = [...DATA.tickets];
  if (filter === 'upcoming') rows = rows.filter(t => !t.finalStatus);
  else if (filter !== 'all') rows = rows.filter(t => (t.finalStatus || 'null') === filter);
  if (search) {
    const q = search.toLowerCase();
    rows = rows.filter(t =>
      (t.flightNumber || '').toLowerCase().includes(q) ||
      (t.from || '').toLowerCase().includes(q) ||
      (t.to || '').toLowerCase().includes(q) ||
      (t.displayName || '').toLowerCase().includes(q) ||
      (t.passengers || []).some(p => p.toLowerCase().includes(q))
    );
  }
  rows.sort((a, b) => {
    if (currentSort.startsWith('time')) {
      const d = (a.startTime || '').localeCompare(b.startTime || '');
      return currentSort === 'time_asc' ? d : -d;
    }
    const da = discOf(a), db = discOf(b);
    if (da == null && db == null) return 0;
    if (da == null) return 1;
    if (db == null) return -1;
    const d = da - db;
    return currentSort === 'disc_asc' ? d : -d;
  });
  if (!rows.length) { list.innerHTML = '<div class="empty">無符合記錄</div>'; return; }
  list.innerHTML = rows.map(t => ticketCard(t)).join('');
}

document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  renderTickets(currentFilter, currentSearch);
});

function ticketCard(t) {
  const st = t.finalStatus || 'null';
  const badge = st === 'null'
    ? '<span class="status-badge status-null">✈️ 即將起飛</span>'
    : `<span class="status-badge status-${st.replace(' ', '-')}">${st}</span>`;
  const pax = t.passengers.length
    ? t.passengers.map(p => {
        const av = (DATA.paxAvatars && DATA.paxAvatars[p]) ? 'pax-avatars/' + DATA.paxAvatars[p] : '';
        const avHtml = av ? `<img class="pax-avatar" src="${av}" onerror="this.style.display='none'" alt="">` : '';
        return `<span class="pax-chip">${avHtml}<span class="pax-link" onclick="jumpToPax('${p.replace(/'/g, "\\'")}')">${p}</span></span>`;
      }).join(' ')
    : '—';
  const origV = t.yListedHk != null ? Number(t.yListedHk) : null;
  const paidV = t.yHk != null ? Number(t.yHk) : null;
  const discount = (origV && paidV && origV > 0) ? Math.round((1 - paidV / origV) * 100) : null;
  const orig = fmtMoney(t.yListedHk);
  const paid = fmtMoney(t.yHk);
  const am = fmtMoney(t.yMilesHk);
  let barsHtml;
  if (!orig && !paid && !am) {
    barsHtml = '<div class="bar-null">無數據</div>';
  } else {
    const vals = [];
    if (orig != null) vals.push({ label: '原價', v: Number(orig.replace(/,/g,'').replace('$','')), cls: 'b-orig' });
    if (paid != null) vals.push({ label: '實付', v: Number(paid.replace(/,/g,'').replace('$','')), cls: 'b-paid' });
    if (am != null) vals.push({ label: 'AM', v: Number(am.replace(/,/g,'').replace('$','')), cls: 'b-am' });
    const maxV = Math.max(...vals.map(x => x.v), 1);
    barsHtml = `<div class="bar-chart">` + vals.map(x => {
      const h = Math.max(Math.round(x.v / maxV * 68), 3);
      return `<div class="bar-col"><div class="bar-val">$${Number(x.v).toLocaleString()}</div><div class="bar ${x.cls}" style="height:${h}px"></div><div class="bar-name">${x.label}</div></div>`;
    }).join('') + `</div>`;
  }
  const shots = t.screenshots || [];
  const shotsHtml = shots.length
    ? shots.map((s, i) => `<a onclick="openLightbox('${s}', ${i})">📷 截圖${shots.length>1 ? ' '+(i+1) : ''}</a>`).join('')
    : '';
  const discountHtml = discount != null
    ? `<div class="bar-discount">折扣 ${discount}%</div>`
    : `<div class="bar-discount none">折扣 —</div>`;
  const pendingEdits = getPaidEdits();
  const pendingAmt = pendingEdits[t.id];
  const effPaid = pendingAmt != null ? Number(pendingAmt) : paidV;
  let paidHtml;
  if (effPaid != null && !isNaN(effPaid)) {
    const tag = pendingAmt != null ? ' <span class="pending-tag">待推送</span>' : '';
    paidHtml = `<div class="tc-paid">💰 實付：<b>HK$${Number(effPaid).toLocaleString()}</b>${tag} <button class="edit-btn" onclick="editPaid('${t.id.replace(/'/g, "\\'")}')">✏️ 修改</button></div>`;
  } else {
    paidHtml = `<div class="tc-paid">💰 實付：<b style="color:var(--sub)">未填</b> <button class="edit-btn" onclick="editPaid('${t.id.replace(/'/g, "\\'")}')">✏️ 補實付</button></div>`;
  }
  return `
    <div class="ticket-card">
      <div class="tc-main">
        <div class="tc-top">
          <span class="tc-flight">${t.flightNumber || '—'}</span>
          ${badge}
        </div>
        <div class="tc-route">${t.from} → ${t.to}</div>
        <div class="tc-grid">
          <div>🕐 起飛：<b>${t.startTime || '—'}</b></div>
          <div>✈️ 機型：<b>${t.planeModel || '—'}</b></div>
          <div>👥 Capacity：<b>${t.capacity != null ? t.capacity : '—'}</b></div>
          <div>📊 Booked：<b>${t.booked != null ? t.booked : '—'}</b></div>
          <div>P25：<b>${t.p25 != null ? t.p25 : '—'}</b></div>
          <div>P27：<b>${t.p27 != null ? t.p27 : '—'}</b></div>
        </div>
        <div class="tc-pax">乘客：<b>${pax}</b></div>
        <div class="tc-shot">${shotsHtml}</div>
        ${paidHtml}
      </div>
      <div class="tc-bars">
        ${barsHtml}
        ${discountHtml}
      </div>
    </div>`;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTickets(currentFilter, currentSearch);
  });
});

document.getElementById('searchBox').addEventListener('input', e => {
  currentSearch = e.target.value;
  renderTickets(currentFilter, currentSearch);
});

function getPaxRoutes(month) {
  const nameToId = {};
  DATA.passengers.forEach(p => { nameToId[p.name] = p.id; });
  const result = {};
  DATA.passengers.forEach(p => { result[p.id] = { name: p.name, appName: p.appName, routes: {}, flights: 0 }; });
  const allTickets = [...(DATA.tickets || []), ...(DATA.upcoming || [])];
  allTickets.forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (month && m !== month) return;
    (t.passengers || []).forEach(pn => {
      const id = nameToId[pn];
      if (id && result[id]) {
        const key = t.from + '-' + t.to;
        result[id].routes[key] = (result[id].routes[key] || 0) + 1;
        result[id].flights++;
      }
    });
  });
  return result;
}

function renderPaxCombo() {
  const paxRoutes = getPaxRoutes(selectedMonth);
  const sel = document.getElementById('paxSelect');
  sel.innerHTML = `<option value="">（無）不顯示航線</option>` +
    `<option value="ALL">👥 全部乘客</option>` +
    DATA.passengers.map(p => {
      const pr = paxRoutes[p.id];
      const n = pr ? pr.flights : 0;
      return `<option value="${p.id}">${p.name}（${n} 班）</option>`;
    }).join('');
  sel.value = selectedPax || '';
}

document.getElementById('paxSelect').addEventListener('change', e => {
  const v = e.target.value;
  selectedPax = (v === '' ? null : v);
  refreshMapLines();
});

function renderAirportCombo() {
  const sel = document.getElementById('airportSelect');
  sel.innerHTML = `<option value="ALL">全部機場</option>` +
    Object.keys(AIRPORTS).map(code =>
      `<option value="${code}">${code} · ${AIRPORTS[code].city}</option>`
    ).join('');
  sel.value = selectedAirportCode;
}

document.getElementById('airportSelect').addEventListener('change', e => {
  selectedAirportCode = e.target.value || 'ALL';
  refreshMapAll();
});

function setupMonthSlider() {
  const months = new Set();
  [...(DATA.tickets || []), ...(DATA.upcoming || [])].forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (m) months.add(m);
  });
  monthsList = [...months].sort();
  const slider = document.getElementById('monthSlider');
  const label = document.getElementById('monthLabel');
  const btn = document.getElementById('monthAllBtn');
  slider.min = 0;
  slider.max = Math.max(monthsList.length - 1, 0);
  slider.value = monthsList.length - 1;
  selectedMonth = null;
  label.textContent = '全部';
  btn.classList.add('on');
  slider.addEventListener('input', () => {
    const m = monthsList[Number(slider.value)] || null;
    selectedMonth = m;
    label.textContent = m || '—';
    btn.classList.remove('on');
    renderPaxCombo();
    refreshMapAll();
  });
  btn.addEventListener('click', () => {
    selectedMonth = null;
    label.textContent = '全部';
    btn.classList.add('on');
    renderPaxCombo();
    refreshMapAll();
  });
}

document.getElementById('regionSelect').addEventListener('change', e => {
  selectedRegion = e.target.value || 'ALL';
  refreshMapAll();
});

function refreshMapAll() {
  if (mapChart) buildMapOption(mapHasGeo);
}

function jumpToPax(name) {
  const p = DATA.passengers.find(x => x.name === name || (x.appName || '').includes(name));
  if (!p) return;
  switchTab('map');
  selectedPax = p.id;
  const sel = document.getElementById('paxSelect');
  if (sel) sel.value = p.id;
  setTimeout(() => { if (mapChart) { mapChart.resize(); refreshMapLines(); } }, 80);
}

function getAirportStats(month) {
  const stats = {};
  Object.keys(AIRPORTS).forEach(code => { stats[code] = { departures: 0, arrivals: 0, flights: 0, flightList: [] }; });
  const allTickets = [...(DATA.tickets || []), ...(DATA.upcoming || [])];
  allTickets.forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (month && m !== month) return;
    if (AIRPORTS[t.from]) {
      stats[t.from].departures++; stats[t.from].flights++;
      stats[t.from].flightList.push({ fn: t.flightNumber, route: `${t.from}→${t.to}`, time: t.startTime, status: t.finalStatus });
    }
    if (AIRPORTS[t.to]) {
      stats[t.to].arrivals++; stats[t.to].flights++;
      stats[t.to].flightList.push({ fn: t.flightNumber, route: `${t.from}→${t.to}`, time: t.startTime, status: t.finalStatus });
    }
  });
  return stats;
}

function getAllRoutes(month) {
  const routes = {};
  const allTickets = [...(DATA.tickets || []), ...(DATA.upcoming || [])];
  allTickets.forEach(t => {
    const m = (t.startTime || '').slice(0, 7);
    if (month && m !== month) return;
    const key = t.from + '-' + t.to;
    routes[key] = (routes[key] || 0) + 1;
  });
  return routes;
}

function visibleAirportCodes() {
  return Object.keys(AIRPORTS).filter(code => {
    if (code === 'HKG') return true;
    if (selectedRegion !== 'ALL' && AIRPORTS[code].region !== selectedRegion) return false;
    return true;
  });
}

function renderMap() {
  const el = document.getElementById('mapChart');
  if (!mapChart) mapChart = echarts.init(el);
  fetch('https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/world.json')
    .then(r => r.json())
    .then(worldJson => {
      echarts.registerMap('world', worldJson);
      mapHasGeo = true;
      buildMapOption(true);
    })
    .catch(() => { mapHasGeo = false; buildMapOption(false); });
}

function buildMapOption(hasGeo) {
  const airportStats = getAirportStats(selectedMonth);
  const visCodes = visibleAirportCodes();
  const visSet = new Set(visCodes);
  const scatterData = visCodes.map(code => {
    const a = AIRPORTS[code];
    const s = airportStats[code];
    const isSel = code === selectedAirportCode;
    return { name: code, value: [a.lng, a.lat, s.flights], city: a.city, airport: a.name, departures: s.departures, arrivals: s.arrivals, flights: s.flights, sel: isSel };
  });
  let rawRoutes = null;
  if (selectedPax === 'ALL') rawRoutes = getAllRoutes(selectedMonth);
  else if (selectedPax) {
    const paxRoutes = getPaxRoutes(selectedMonth);
    const pr = paxRoutes[selectedPax];
    if (pr) rawRoutes = pr.routes;
  }
  let lineData = [];
  if (rawRoutes) {
    lineData = Object.keys(rawRoutes).map(key => {
      const [from, to] = key.split('-');
      return { fromName: from, toName: to, coords: [[AIRPORTS[from].lng, AIRPORTS[from].lat], [AIRPORTS[to].lng, AIRPORTS[to].lat]], count: rawRoutes[key] };
    }).filter(l => visSet.has(l.fromName) && visSet.has(l.toName));
  }
  if (selectedAirportCode !== 'ALL') {
    lineData = lineData.filter(l => l.fromName === selectedAirportCode || l.toName === selectedAirportCode);
  }
  const option = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: p => {
        if (p.seriesType === 'scatter') {
          const tag = p.data.sel ? ' ⭐ 已選' : '';
          return `<b>${p.name}</b>${tag} — ${p.data.city}<br>${p.data.airport}<br>航班總數：${p.data.flights} 班<br>出發：${p.data.departures} · 抵達：${p.data.arrivals}`;
        }
        if (p.seriesType === 'lines') {
          let src;
          if (selectedPax === 'ALL') src = getAllRoutes(selectedMonth);
          else { const paxRoutes = getPaxRoutes(selectedMonth); src = paxRoutes[selectedPax] ? paxRoutes[selectedPax].routes : {}; }
          const count = src[p.data.fromName + '-' + p.data.toName] || p.data.count;
          return `${p.data.fromName} → ${p.data.toName}<br>${count} 班`;
        }
        return p.name;
      }
    },
    geo: hasGeo ? { map: 'world', roam: true, zoom: 1.8, center: [100, 25], itemStyle: { areaColor: '#1a2233', borderColor: '#2e3a55', borderWidth: 0.5 }, emphasis: { itemStyle: { areaColor: '#212c42' }, label: { show: false } }, label: { show: false } } : null,
    series: [
      { name: '乘客航線', type: 'lines', coordinateSystem: hasGeo ? 'geo' : undefined, polyline: false, symbol: ['none', 'arrow'], symbolSize: 6, effect: { show: true, period: 4, trailLength: 0.3, symbol: 'arrow', symbolSize: 5, color: '#7eb0ff' }, lineStyle: { color: '#4f8cff', width: 2, opacity: 0.85, curveness: 0.15 }, data: lineData },
      { name: '機場', type: 'scatter', coordinateSystem: hasGeo ? 'geo' : undefined, symbol: 'path://' + PLANE_PATH, symbolSize: (v, params) => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? 34 : 22, symbolRotate: 0, itemStyle: { color: params => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? '#ff8c42' : '#ffc53d', shadowBlur: params => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? 18 : 10, shadowColor: params => (scatterData[params.dataIndex] && scatterData[params.dataIndex].sel) ? 'rgba(255,140,66,0.8)' : 'rgba(255,197,61,0.6)' }, label: { show: true, formatter: '{b}', position: 'bottom', color: '#e8ecf4', fontSize: 11, fontWeight: 600 }, data: scatterData }
    ]
  };
  if (!hasGeo) {
    option.xAxis = { type: 'value', min: 60, max: 200, axisLabel: { color: '#8fa0b8' }, splitLine: { lineStyle: { color: '#1a2233' } } };
    option.yAxis = { type: 'value', min: -60, max: 60, axisLabel: { color: '#8fa0b8' }, splitLine: { lineStyle: { color: '#1a2233' } } };
  }
  mapChart.setOption(option, true);
  mapChart.off('click');
  mapChart.on('click', p => { if (p.seriesType === 'scatter' && p.data && p.data.name) showAirportDetail(p.data.name); });
  window.addEventListener('resize', () => mapChart.resize());
}

function refreshMapLines() { if (!mapChart) return; buildMapOption(mapHasGeo); }

function showAirportDetail(code) {
  const airportStats = getAirportStats(selectedMonth);
  const a = AIRPORTS[code];
  const s = airportStats[code];
  const panel = document.getElementById('airportDetail');
  const flights = s.flightList
    .sort((x, y) => (x.time || '').localeCompare(y.time || ''))
    .map(f => {
      const st = f.status ? f.status : '即將起飛';
      const badge = `<span class="status-badge status-${String(st).replace(' ', '-')}">${st}</span>`;
      return `<div class="adp-flight"><span><b>${f.fn}</b> ${f.route} · ${f.time || '—'}</span>${badge}</div>`;
    }).join('') || '<div class="adp-flight">暫無航班</div>';
  panel.innerHTML = `
    <div class="adp-title">🛫 ${code} — ${a.name}</div>
    <div class="adp-row"><span>城市</span><b>${a.city}</b></div>
    <div class="adp-row"><span>區域</span><b>${REGION_LABEL[a.region]}</b></div>
    <div class="adp-row"><span>座標</span><b>${a.lat.toFixed(4)}°, ${a.lng.toFixed(4)}°</b></div>
    <div class="adp-row"><span>航班總數</span><b>${s.flights} 班</b></div>
    <div class="adp-row"><span>出發</span><b>${s.departures} 班</b></div>
    <div class="adp-row"><span>抵達</span><b>${s.arrivals} 班</b></div>
    <div class="adp-flights">${flights}</div>`;
  panel.classList.add('show');
  if (mapChart) mapChart.dispatchAction({ type: 'showTip', seriesIndex: 1, name: code });
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="' + tab + '"]').classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  setTimeout(() => {
    if (tab === 'map' && mapChart) mapChart.resize();
    if (tab === 'stats') {
      const pc = echarts.getInstanceByDom(document.getElementById('pieChart'));
      if (pc) pc.resize();
      const lc = echarts.getInstanceByDom(document.getElementById('lineChart'));
      if (lc) lc.resize();
    }
  }, 50);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

const PAID_EDIT_KEY = 'cathayPaidEdits';
function getPaidEdits() {
  try { return JSON.parse(localStorage.getItem(PAID_EDIT_KEY)) || {}; }
  catch (e) { return {}; }
}
function editPaid(recordId) {
  const t = DATA.tickets.find(x => x.id === recordId);
  if (!t) return;
  const orig = t.yHk != null ? t.yHk : '';
  const input = prompt(`輸入「${t.flightNumber} ${t.from}→${t.to}」嘅實付價錢（HKD）：`, orig);
  if (input === null) return;
  const v = Number(input.replace(/,/g, '').replace('HK$', '').trim());
  if (isNaN(v) || v < 0) { alert('⚠️ 請輸入有效價錢（數字）'); return; }
  const edits = getPaidEdits();
  edits[recordId] = v;
  localStorage.setItem(PAID_EDIT_KEY, JSON.stringify(edits));
  updateActionBar();
  renderTickets(currentFilter, currentSearch);
}

const J09_WORKER = 'https://j09-cathay-proxy.hkharrycheng.workers.dev';

function updateActionBar() {
  const pending = Object.keys(getPaidEdits());
  document.getElementById('pushBtn').classList.toggle('has-pending', pending.length > 0);
  document.getElementById('pushBtn').textContent = pending.length
    ? `📤 推送實付（${pending.length}）` : '📤 推送實付到飛書';
}

async function pushToLark() {
  const edits = getPaidEdits();
  const keys = Object.keys(edits);
  if (!keys.length) { alert('⚠️ 冇待推送嘅實付價錢。請先喺航班卡按「✏️ 補實付」輸入。'); return; }
  document.getElementById('pushModal').classList.add('show');
  const st = document.getElementById('pushStatus');
  st.className = 'modal-status';
  st.textContent = '提交到 Cloudflare Worker...';
  try {
    const resp = await fetch(J09_WORKER + '/api/paid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: edits, updatedAt: new Date().toISOString() }),
    });
    const j = await resp.json();
    if (j.ok > 0 && (!j.fail || j.fail === 0)) {
      st.className = 'modal-status ok';
      st.textContent = `✅ 全部成功！已更新 ${j.ok} 條記錄到飛書。`;
      // 即時將新實付值寫入內存 DATA，UI 即刻反映
      [...(DATA.tickets||[]), ...(DATA.upcoming||[])].forEach(t => {
        if (edits[t.id] != null) t.yHk = Number(edits[t.id]);
      });
      localStorage.setItem(PAID_EDIT_KEY, '{}');
      updateActionBar();
      renderTickets(currentFilter, currentSearch);
      setTimeout(closePushModal, 1500);
    } else if (j.ok > 0) {
      st.className = 'modal-status err';
      st.textContent = `⚠️ 部分完成：成功 ${j.ok} / 失敗 ${j.fail}` + (j.errors && j.errors.length ? '\n' + j.errors.slice(0, 3).join('\n') : '');
    } else {
      st.className = 'modal-status err';
      st.textContent = '❌ 失敗：' + (j.errors && j.errors[0] || j.error || resp.status);
    }
  } catch (e) {
    console.error('提交錯誤:', e);
    st.className = 'modal-status err';
    st.textContent = '❌ 錯誤：' + e.message;
  }
}

function closePushModal() { document.getElementById('pushModal').classList.remove('show'); }

loadData();

name: Regenerate Cathay JSON
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/pending-paid.json'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install requests
      - name: Regenerate cathay.json
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BASE_TOKEN: C2x4byTkEaN3Ths9FXwcagDSn5e
          TICKETS_TABLE: tbl97F6lmemjat8V
          PASSENGERS_TABLE: tblxBC2f3i4L3Khh
        run: python .github/scripts/regen_json.py
      - name: Commit updated cathay.json
        run: |
          git config user.name "cathay-bot"
          git config user.email "cathay-bot@users.noreply.github.com"
          git add cathay.json
          git diff --staged --quiet || git commit -m "auto: regenerate cathay.json [skip ci]"
          git push
